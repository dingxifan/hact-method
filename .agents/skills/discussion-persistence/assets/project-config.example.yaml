# Example per-project persistence configuration
# This file is advisory for the Skill. The local Watcher must separately
# contain a matching entry in its `repos` configuration.

version: 1

project:
  id: example-project

persistence:
  repo_key: example-project
  transport: dropbox
  dropbox_root: /HACT
  wire_schema: hact.publish.v1

git:
  repository: owner/example-project
  base_branch: main
  candidate_branch_prefix: chat/persist/
  incremental_base_prefixes:
    - chat/persist/

verification:
  require_result_json: true
  require_github_commit: true

# Runtime rule:
# - NEW_CANDIDATE: base_branch is the configured primary branch.
# - INCREMENTAL_CANDIDATE: base_branch == target_branch and the branch must
#   match one of incremental_base_prefixes.
