# status.yml · 机器侧状态契约（项目根，由 init-project 创建一次）
# 字段定义见 ../hact-method-lab/skeleton/07-status-contract.md。机器侧消费者（check-sprint.js / check-system-review.js / check-gate.js）按受控 YAML 结构读取。
# 序列化：沿用下方缩进与块式 tasks；Gate 用 signed/date 内联或分行对象，不随意改紧凑 YAML 形态。
# 写入纪律：每次只改对应字段，其余不动；显式写 null，不省略键。
# 总规则：凡往 iterations/vN/queue/ 写任务包处，同步往 tasks[] 追加一条；状态流转按 task-id 改。

project: {项目名}
schema: 1
generated_by: hact-method

iterations:
  v1:
    gates:
      G1: { signed: false, date: null }
      G2: { signed: false, date: null }
      G3: { signed: false, date: null }
      G4: { signed: false, date: null }
      G5: { signed: false, date: null }
# v0 走骨架（A 类项目，先于 V1）：draft-foundation 建 iterations.v0 块，仅 G2（无 G1/G3-5）：
#   v0:
#     gates:
#       G2: { signed: false, date: null }
# 后续迭代由 draft-prd-vN 签 G1 时按需新增 vN 块（结构同 v1）

tasks: []
# 每条（写 queue 任务包处同步追加）：
#  - id: {缩写}-v{N}-001     # B 类为 {缩写}-b-001
#    iteration: v1           # 属哪期；B 类(bug/optimization)为 null
#    sprint: 1               # B 类 / 修复任务为 null
#    source: sprint          # sprint / foundation / integration / manual-test / bug / optimization
#    title: ...
#    type: develop           # canonical Core Task type；普通开发 work item 为 develop
#    layer: backend          # frontend / backend / shared / null
#    status: 可取            # 可取 / taken-by / done / merged
#    assigned_to: null
#    pr: null
#    parent_id: null
#    depends_on: []
#    delivery: 可并行         # 串行 / 可并行 / null
#    urgency: null           # hotfix / null
# System Verification 复用同一 tasks[]，每 iteration 恰有一条；Phase 4 接 checker/hook：
#  - id: {项目缩写}-v1-integration-verify
#    iteration: v1
#    sprint: null
#    source: null
#    title: System Verification
#    type: integration-verify
#    layer: null
#    status: 可取
#    assigned_to: null
#    pr: null
#    parent_id: null
#    depends_on: []
#    delivery: null
#    urgency: null
#    latest_system_review: iterations/v1/system-review/review-001.md
#    integration_result: integration-tests/result-{date}.md
#    final_candidate: {40-char project commit SHA}

integration_tests: []
# 每条（integration-verify 的 runtime lane 创建/更新）：
#  - { iteration: v1, index: 1, description: ..., status: 待执行, failure_reason: null }
#    # status: 待执行 / 执行中 / 通过 / 失败

code_reviews: []
# 每个 develop task 只保留最新 review pointer；findings/轮次在 immutable report chain：
#  - task_id: {develop task id}
#    reviewed_candidate: {40-char commit/tree SHA}
#    latest_review: iterations/v1/code-reviews/{task-id}/round-02.md  # B 类为 b-reviews/...
#    conclusion: pass       # pass / blocked
